<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faisceaux vortex · OpenBeam</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/viewer.css">
</head>
<!-- Generic beam viewer page: every text and control is filled in by ../build/viewers/vortex.js. -->
<body>
  <header>
    <a class="back" id="back" href="../index.html" data-i18n="back"></a>
    <h1 id="beam-title">Faisceaux vortex</h1>
    <div class="controls" id="controls">
      <div class="group segmented" role="radiogroup">
        <input type="radio" name="mode" id="mode-fixed" checked><label for="mode-fixed" data-i18n="modeFixed"></label>
        <input type="radio" name="mode" id="mode-moving"><label for="mode-moving" data-i18n="modeMoving"></label>
      </div>
      <div class="group" id="variants" hidden>
        <span class="group-title" id="variants-title"></span>
        <div class="segmented" role="radiogroup"></div>
      </div>
      <div class="group">
        <span class="group-title" data-i18n="views"></span>
        <div class="chips" id="view-chips"></div>
      </div>
      <div class="group">
        <button id="play"></button>
        <input type="range" id="position" min="0" max="1000" value="0">
      </div>
      <div class="group fixed-only">
        <label for="speed-fixed" data-i18n="speed"></label>
        <input type="range" id="speed-fixed" min="0.05" max="2" step="0.05" value="0.5">
        <span class="value" id="speed-fixed-value"></span>
      </div>
      <div class="group moving-only" hidden>
        <label for="speed-moving" data-i18n="speed"></label>
        <input type="range" id="speed-moving" min="3" max="30" step="1" value="10" style="direction: rtl">
        <span class="value" id="speed-moving-value"></span>
      </div>
      <div id="params" class="boosts"></div>
      <button id="reset-view" data-i18n="reset"></button>
    </div>
    <button id="lang" class="lang"></button>
    <button id="settings-toggle" aria-expanded="false" aria-controls="controls" data-i18n="settings"></button>
  </header>
  <main>
    <canvas id="view"></canvas>
    <div id="frames"></div>
    <div id="readout"></div>
  </main>
  <footer>
    <details id="about" open>
      <summary data-i18n="about"></summary>
      <p id="mode-help"></p>
      <p id="about-text"></p>
      <p id="references"></p>
      <p data-i18n="license"></p>
    </details>
  </footer>
  <script src="../build/viewers/vortex.js"></script>
</body>
</html>
